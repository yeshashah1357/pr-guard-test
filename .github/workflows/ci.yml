name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prguard
          POSTGRES_PASSWORD: prguard
          POSTGRES_DB: prguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prguard" --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (coverage gate 85%)
        run: pytest
      - name: Migrations apply cleanly on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://prguard:prguard@localhost:5432/prguard
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pr-guard-api backend
      - run: docker build -t pr-guard-web frontend
