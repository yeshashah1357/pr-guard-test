[project]
name = "pr-guard"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "E501"]
"app/services/analyzers.py" = ["S603"]  # fixed argv, no shell

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["app/worker.py"]
